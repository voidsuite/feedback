services:
  voidauth-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voidauth-server
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    restart: always
    # Add labels for Coolify if needed, but Coolify usually handles this
    # networks:
    #   - public

# networks:
#   public:
#     external: true
