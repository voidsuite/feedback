# m3il — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  mail:
    build: .
    image: ghcr.io/voidsuite/mail:latest
    container_name: m3il
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:3003"
    env_file:
      - .env
