# docs — gitleaks configuration.
# Extends gitleaks' default rules; allowlists files that legitimately contain
# high-entropy strings (lockfiles, build output).
title = "vdocs gitleaks config"

[extend]
useDefault = true

[allowlist]
# The VoidAuth storage-key names (e.g. "vdocs_vault_escrow_v1") look like
# API keys to the generic-api-key heuristic but are just identifiers.
regexes = [
  '''vdocs_vault_escrow_v1''',
]
paths = [
  '''(^|/)bun\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)client/dist/''',
  '''(^|/)\.env\.example$''',
]