# docs — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  docs:
    build: .
    image: ghcr.io/voidsuite/docs:latest
    container_name: vdocs
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3005"
    env_file:
      - .env