# voidfeedback — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  voidfeedback:
    build: .
    image: ghcr.io/voidsuite/voidfeedback:latest
    container_name: voidfeedback
    restart: unless-stopped
    ports:
      - "${PORT:-3009}:3009"
    env_file:
      - .env
    volumes:
      # SQLite database + uploads persist across container recreates.
      - feedback-data:/app/server/data

volumes:
  feedback-data:
