# board — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  board:
    build: .
    image: ghcr.io/voidsuite/board:latest
    container_name: board
    restart: unless-stopped
    ports:
      - "${PORT:-3006}:3006"
    env_file:
      - .env
    volumes:
      # SQLite database + uploads persist across container recreates.
      - board-data:/app/server/data

volumes:
  board-data: